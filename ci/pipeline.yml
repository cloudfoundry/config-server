---
jobs:
  - name: test-golangci-lint
    public: true
    plan:
      - in_parallel:
          - get: golang-image
          - get: config-server
            trigger: true
      - task: test-golangci-lint
        file: config-server/ci/tasks/test-golangci-lint.yml
        image: golang-image

  - name: test-unit
    public: true
    plan:
      - in_parallel:
        - get: config-server
          trigger: true
        - get: golang-image
      - task: test-unit
        file: config-server/ci/tasks/test-unit.yml
        image: golang-image

  - name: test-integration-in-memory
    public: true
    plan:
      - in_parallel:
        - get: bosh-integration-image
        - get: config-server
          trigger: true
      - task: test-integration
        image: bosh-integration-image
        privileged: true
        file: config-server/ci/tasks/test-integration.yml
        params:
          DB: memory

  - name: test-integration-mysql
    public: true
    plan:
      - in_parallel:
        - get: bosh-integration-mysql-8-0-image
        - get: config-server
          trigger: true
      - task: test-integration
        image: bosh-integration-mysql-8-0-image
        privileged: true
        file: config-server/ci/tasks/test-integration.yml
        params:
          DB: mysql

  - name: test-integration-postgresql
    public: true
    plan:
      - in_parallel:
        - get: config-server
          trigger: true
        - get: bosh-integration-postgres-15-image
      - task: test-integration
        image: bosh-integration-postgres-15-image
        privileged: true
        file: config-server/ci/tasks/test-integration.yml
        params:
          DB: postgresql
          DB_VERSION: 15

  - name: build
    public: true
    plan:
      - in_parallel:
        - get: config-server
          passed:
            - test-golangci-lint
            - test-unit
            - test-integration-in-memory
            - test-integration-mysql
            - test-integration-postgresql
          trigger: true
        - get: version-semver
          params:
            bump: patch
        - get: golang-image
      - put: version-semver
        params:
          file: version-semver/number
      - in_parallel:
        - task: build-linux
          file: config-server/ci/tasks/build-linux.yml
          image: golang-image
        - task: build-darwin
          file: config-server/ci/tasks/build-darwin.yml
          image: golang-image
      - put: config-server-promoted
        params:
          repository: config-server
          tag: version-semver/number
          tag_prefix: v

  - name: bump-minor
    public: true
    plan:
      - get: version-semver
        params:
          bump: minor
      - put: version-semver
        params:
          file: version-semver/number

  - name: bump-major
    public: true
    plan:
      - get: version-semver
        params:
          bump: major
      - put: version-semver
        params:
          file: version-semver/number

  - name: bump-deps
    plan:
    - in_parallel:
      - get: config-server
      - get: golang-release
      - get: weekly
        trigger: true
      - get: golang-image
    - task: bump-deps
      file: golang-release/ci/tasks/shared/bump-deps.yml
      input_mapping:
        input_repo: config-server
      output_mapping:
        output_repo: bumped-config-server
    - task: test-unit
      file: config-server/ci/tasks/test-unit.yml
      input_mapping:
        config-server: bumped-config-server
      image: golang-image
    - put: config-server
      params:
        repository: bumped-config-server
        rebase: true

resources:
  - name: bosh-integration-postgres-15-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-postgres-15
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-mysql-8-0-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-mysql-8.0
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/integration
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: golang-image
    type: registry-image
    source:
      repository: golang
      tag: latest
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: config-server
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server.git
      branch: develop
      private_key: ((github_deploy_key_config-server.private_key))

  - name: config-server-promoted
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server.git
      branch: develop
      private_key: ((github_deploy_key_config-server.private_key))

  - name: golang-release
    type: git
    source:
      uri: https://github.com/cloudfoundry/bosh-package-golang-release.git

  - name: version-semver
    type: semver
    source:
      initial_version: "0.1.216"
      driver: git
      uri: git@github.com:cloudfoundry/config-server.git
      private_key: ((github_deploy_key_config-server.private_key))
      branch: release-semver
      file: VERSION

  - name: weekly
    type: time
    source:
      start: 3:00 -0700
      stop: 4:30 -0700
      days: [ Saturday ]

resource_types:
- name: semver
  type: registry-image
  source:
    repository: concourse/semver-resource